<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCORPION_OS // ARCHON-LEVEL OVERRIDE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="scanline"></div>
    <div id="defcon-indicator">[ DEFCON: 5 ]</div>
    <div id="news-ticker">
        <div id="news-marquee">*** SCORPION_OS SYSTEM NOMINAL *** SATELLITE UPLINK ESTABLISHED *** ALL SYSTEMS GREEN ***</div>
    </div>
    <div id="video-overlay" class="hidden">
        <div id="video-container">
            <div id="player"></div>
            <div class="video-frame-text">[ SATELLITE FEED: LIVE ] [ TARGET: LOCKED ]</div>
            <button id="close-video">CLOSE FEED</button>
        </div>
    </div>
    <div class="screen" id="terminal">
        <div id="logo-area"></div>
        <div id="output"></div>
        <div id="cursor-line"><span id="prompt-label"></span><span id="user-input"></span><span id="cursor" class="blink">█</span></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
